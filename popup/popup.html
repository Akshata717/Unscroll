
<!DOCTYPE html>
<html>
<head>
    <title>Unscroll</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Unscroll.</h1>
    <p>Stay connected but not wasting your time scrolling</p>

    <label>
        <input type="checkbox" id="youtubeToggle" checked>
        Block YouTube Shorts
    </label>
    <input type="checkbox" id="tiktokToggle" checked>
        Block Instagram Reels
    </label>
    <label>
    <input type="checkbox" id="tiktokToggle" checked>
        Block TikTok
    </label>

    <script src="popup.js"></script>
</body>
</html>
